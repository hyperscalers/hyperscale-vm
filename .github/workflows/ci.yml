name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both gates run on nightly. The import grouping in rustfmt.toml is
      # a nightly option a stable `cargo fmt` ignores silently, and
      # clippy's newest lints are worth hearing before they reach the
      # channel the crates build on — neither judgment is a consensus
      # artifact, so riding the moving channel costs only churn.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      # The crates themselves build on the channel rust-toolchain.toml
      # pins, which the test job takes.
      - uses: swatinem/rust-cache@v2
      - name: Cargo Fmt
        run: cargo +nightly fmt --all --check
      - name: Cargo Clippy
        run: cargo +nightly clippy --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      # The guest fixtures pin their own toolchain and build with
      # -Zbuild-std, so the lane needs that channel and rust-src present
      # before any test that calls build_guest runs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-08
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cargo Nextest
        run: cargo nextest run --release
      # Nextest does not run doctests; the workspace's public surface is
      # documented, so they run here.
      - name: Doc Tests
        run: cargo test --release --doc
      # A package crate's own tests, run the way its author runs them.
      # Outside the workspace by design, so nothing above reaches them.
      #
      # Both profiles, because they differ in what they catch and in what
      # they prove. Debug checks arithmetic the artifact wraps, so it is
      # the one that catches a body wanting `checked_add`. Release is the
      # arithmetic the chain runs — and running it at all is what would
      # fail if a package crate took back `panic = "abort"`, which builds
      # a host std the test harness cannot link against.
      #
      # Under the guests' own pinned nightly: a package manifest opts in
      # to `trim-paths`, which stable cargo will not parse, and the
      # toolchain a bare `cargo` picks here is the workspace's.
      - name: Package Tests
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-06-08
        run: |
          for manifest in guests/*/Cargo.toml; do
            cargo test --manifest-path "$manifest"
            cargo test --release --manifest-path "$manifest"
          done
