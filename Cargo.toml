[workspace]
resolver = "2"
members = [
    "crates/hbor",
    "crates/hbor-macros",
    "crates/cli",
    "crates/effects",
    "crates/embed",
    "crates/fixtures",
    "crates/gate",
    "crates/types",
    "crates/harness",
    "crates/kernel",
    "crates/manifest-builder",
    "crates/meter",
    "crates/preview",
    "crates/ref",
    "crates/runtime",
    "crates/sdk",
    "crates/sdk-macros",
    "crates/stdlib",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hyperscale-hbor = { path = "crates/hbor" }
hyperscale-hbor-macros = { path = "crates/hbor-macros" }
hyperscale-vm-cli = { path = "crates/cli" }
hyperscale-vm-effects = { path = "crates/effects" }
hyperscale-vm-embed = { path = "crates/embed" }
hyperscale-vm-fixtures = { path = "crates/fixtures" }
hyperscale-vm-gate = { path = "crates/gate" }
hyperscale-vm-types = { path = "crates/types" }
hyperscale-vm-kernel = { path = "crates/kernel" }
hyperscale-vm-manifest-builder = { path = "crates/manifest-builder" }
hyperscale-vm-meter = { path = "crates/meter" }
hyperscale-vm-preview = { path = "crates/preview" }
hyperscale-vm-ref = { path = "crates/ref" }
hyperscale-vm-runtime = { path = "crates/runtime", default-features = false }
hyperscale-vm-sdk = { path = "crates/sdk" }
hyperscale-vm-sdk-macros = { path = "crates/sdk-macros" }
hyperscale-vm-stdlib = { path = "crates/stdlib" }
hyperscale-vm-testing = { path = "crates/testing" }

arbitrary = "1.4.2"
blake3 = "1.8.7"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full", "extra-traits", "visit", "visit-mut"] }
thiserror = "2.0.20"
trybuild = "1.0.121"
wasm-encoder = { version = "=0.254.0", features = ["wasmparser"] }
wasm-smith = "=0.254.0"
wasmparser = "=0.254.0"
wasmtime = { version = "=48.0.2", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "pooling-allocator",
    "pulley",
    "runtime",
    "std",
    "threads",
    "wat",
    "winch",
] }
wat = "=1.254.0"

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
absolute_paths = { level = "warn", priority = -1 }
assert_is_empty = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"
