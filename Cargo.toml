[workspace]
resolver = "2"
members = [
    "crates/hbor",
    "crates/hbor-macros",
    "crates/cli",
    "crates/effects",
    "crates/embed",
    "crates/fixtures",
    "crates/gate",
    "crates/types",
    "crates/harness",
    "crates/kernel",
    "crates/manifest-builder",
    "crates/ref",
    "crates/runtime",
    "crates/sdk",
    "crates/sdk-macros",
    "crates/stdlib",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hyperscale-hbor = { path = "crates/hbor" }
hyperscale-hbor-macros = { path = "crates/hbor-macros" }
hyperscale-vm-cli = { path = "crates/cli" }
hyperscale-vm-effects = { path = "crates/effects" }
hyperscale-vm-embed = { path = "crates/embed" }
hyperscale-vm-fixtures = { path = "crates/fixtures" }
hyperscale-vm-gate = { path = "crates/gate" }
hyperscale-vm-types = { path = "crates/types" }
hyperscale-vm-kernel = { path = "crates/kernel" }
hyperscale-vm-manifest-builder = { path = "crates/manifest-builder" }
hyperscale-vm-ref = { path = "crates/ref" }
hyperscale-vm-runtime = { path = "crates/runtime" }
hyperscale-vm-sdk = { path = "crates/sdk" }
hyperscale-vm-sdk-macros = { path = "crates/sdk-macros" }
hyperscale-vm-stdlib = { path = "crates/stdlib" }
hyperscale-vm-testing = { path = "crates/testing" }

arbitrary = "1.4.2"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit"] }
thiserror = "2.0.19"
trybuild = "1.0.120"
wasm-smith = "0.255.0"
wasmparser = "0.255.0"
wat = "1.255.0"
wit-component = "0.255.0"
# The guest bindings generator, pinned exactly like the guest toolchain and
# for the same reason: what it emits is part of a consensus artifact.
wit-bindgen = "=0.60.0"
# The blessed engine, pinned exactly to the latest stable ahead of the 48 LTS
# (expected 2026-08-20; the pin moves there when it lands). Upgrades are
# deliberate protocol events, never dependency drift.
wasmtime = { version = "=47.0.3", features = ["component-model", "winch", "pulley"] }

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
absolute_paths = { level = "warn", priority = -1 }
assert_is_empty = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"
