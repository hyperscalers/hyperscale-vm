[workspace]
resolver = "2"
members = [
    "crates/vm-effects",
    "crates/vm-harness",
    "crates/vm-kernel",
    "crates/vm-ref",
    "crates/vm-runtime",
    "crates/vm-stdlib",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
hyperscale-vm-effects = { path = "crates/vm-effects" }
hyperscale-vm-kernel = { path = "crates/vm-kernel" }
hyperscale-vm-ref = { path = "crates/vm-ref" }
hyperscale-vm-runtime = { path = "crates/vm-runtime" }
hyperscale-vm-stdlib = { path = "crates/vm-stdlib" }

anyhow = "1"
proptest = "1"
thiserror = "2"
wasmparser = "0.255.0"
wat = "1.255.0"
wit-component = "0.255.0"
# The blessed engine, pinned exactly to the latest stable ahead of the 48 LTS
# (expected 2026-08-20; the pin moves there when it lands). Upgrades are
# deliberate protocol events, never dependency drift.
wasmtime = { version = "=47.0.2", features = ["component-model", "winch", "pulley"] }

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
absolute_paths = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_codeblock_attributes = "warn"
private_intra_doc_links = "allow"
redundant_explicit_links = "warn"
