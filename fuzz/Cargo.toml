# Its own workspace: the fuzz target needs a sanitizer-instrumented build
# and must not join the ordinary one.
[package]
name = "hyperscale-vm-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1"
hyperscale-hbor = { path = "../crates/hbor" }
hyperscale-vm-effects = { path = "../crates/effects" }
hyperscale-vm-harness = { path = "../crates/harness" }
hyperscale-vm-kernel = { path = "../crates/kernel" }
hyperscale-vm-ref = { path = "../crates/ref" }
hyperscale-vm-runtime = { path = "../crates/runtime" }
libfuzzer-sys = "0.4"
wasm-smith = "0.236"
wasmtime = "47"
wat = "1"

[[bin]]
name = "admitted_is_executable"
path = "fuzz_targets/admitted_is_executable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_trace_is_declared"
path = "fuzz_targets/session_trace_is_declared.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hbor_decode"
path = "fuzz_targets/hbor_decode.rs"
test = false
doc = false
bench = false

[workspace]
