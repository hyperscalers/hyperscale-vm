[package]
name = "derived-account"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "=0.60.0"
# The contract SDK. `#[blueprint]` is what authors this package: the
# declaration on a host build, the component on a guest one.
hyperscale-vm-sdk = { path = "../../crates/sdk" }

[profile.release]
opt-level = "s"
lto = true
# One unit per crate: nothing about the artifact's function order is
# left to codegen-unit partitioning or LTO merge order.
codegen-units = 1
panic = "abort"

# Deliberately outside the host workspace: this crate compiles to
# wasm32-unknown-unknown and is built by the harness, not by workspace builds.
[workspace]
