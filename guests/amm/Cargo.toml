[package]
name = "amm-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.60.0"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

# Deliberately outside the host workspace: this crate compiles to
# wasm32-unknown-unknown and is built by the harness, not by workspace builds.
[workspace]
