[package]
name = "transfer-guest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.60.0"
# The contract SDK's guest half: the kernel bindings and the state
# vocabulary. Default features off — `#[blueprint]` is a host-side
# derivation and a guest build has nothing to derive.
hyperscale-vm-sdk = { path = "../../crates/sdk", default-features = false }

[profile.release]
opt-level = "s"
lto = true
# One unit per crate: nothing about the artifact's function order is
# left to codegen-unit partitioning or LTO merge order.
codegen-units = 1
panic = "abort"

# Deliberately outside the host workspace: this crate compiles to
# wasm32-unknown-unknown and is built by the harness, not by workspace builds.
[workspace]
