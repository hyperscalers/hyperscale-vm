[package]
name = "hyperscale-vm-effects"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Effect signatures, the access DSL evaluator, and the routing fold"

[features]
# Test-fixture constructors: a Declaration from a bare set, with no clause
# order to evaluate. Production paths evaluate signatures.
testing = []

[dependencies]
hyperscale-hbor.workspace = true
hyperscale-vm-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A dev-only cycle: a package ships with the crate that holds its blob,
# and the sweeps over every package have to see them all.
hyperscale-vm-fixtures.workspace = true
hyperscale-vm-stdlib.workspace = true
proptest.workspace = true

[lints]
workspace = true
