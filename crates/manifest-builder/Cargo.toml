[package]
name = "hyperscale-vm-manifest-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fluent client-side construction of manifest graphs"

[dependencies]
hyperscale-hbor.workspace = true
hyperscale-vm-effects.workspace = true
hyperscale-vm-types.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The effects testing feature, for the tests' fixture seeding.
hyperscale-vm-effects = { workspace = true, features = ["testing"] }
# A dev-only cycle: the wrappers moved to the crates that own the
# packages, and the builder's own tests still compose graphs out of them.
hyperscale-vm-fixtures.workspace = true
hyperscale-vm-stdlib.workspace = true
proptest.workspace = true
trybuild.workspace = true

[lints]
workspace = true
