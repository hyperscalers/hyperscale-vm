[package]
name = "hyperscale-vm-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Differential lanes, corpora, and guest fixtures for vm-runtime vs vm-ref"

[dependencies]
# The guest build, so a test and `cargo hyperscale` compile one way.
hyperscale-vm-cli.workspace = true
hyperscale-vm-effects = { workspace = true, features = ["testing"] }
hyperscale-vm-embed.workspace = true
hyperscale-vm-kernel.workspace = true
hyperscale-vm-types.workspace = true
hyperscale-vm-ref.workspace = true
hyperscale-vm-runtime = { workspace = true, features = ["engine"] }
# The driver's blessed lane and native dispatch: one home for "a
# GuestBackend over a component set", shared with every consumer.
hyperscale-vm-testing.workspace = true
wasmtime.workspace = true
wit-component.workspace = true

[dev-dependencies]
arbitrary.workspace = true
hyperscale-vm-fixtures.workspace = true
hyperscale-vm-manifest-builder.workspace = true
# The numeric vocabulary a configuration struct's fields are typed in.
hyperscale-vm-sdk.workspace = true
hyperscale-vm-stdlib.workspace = true
wasm-smith.workspace = true
wasmparser.workspace = true
wat.workspace = true

[lints]
workspace = true
