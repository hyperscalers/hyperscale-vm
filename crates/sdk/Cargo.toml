[package]
name = "hyperscale-vm-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The contract SDK: blueprint declarations traced into package metadata"

[features]
default = ["macros"]
# The `#[blueprint]` front end. Separable because the tracer underneath is
# usable on its own, and a build that only consumes metadata should not
# compile a proc macro to get it.
macros = ["dep:hyperscale-vm-sdk-macros"]

[dependencies]
hyperscale-vm-effects.workspace = true
hyperscale-vm-sdk-macros = { workspace = true, optional = true }

# The kernel bindings a contract body executes against, on the target
# that has a kernel to call: the imports, and the generator for them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

# The same surface from the other side. A host build is the kernel's
# caller rather than its guest, so what it needs is the trait an engine
# implements — never the artifact a package publishes, which is why this
# mirrors `wit-bindgen` being the wasm32-only one.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyperscale-vm-embed.workspace = true

[dev-dependencies]
hyperscale-vm-fixtures.workspace = true
# A session to dispatch against: what the generated native half is called
# with, and the one thing the SDK itself deliberately cannot name.
hyperscale-vm-kernel.workspace = true
hyperscale-vm-stdlib.workspace = true
trybuild.workspace = true

[lints]
workspace = true
