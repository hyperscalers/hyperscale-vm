[package]
name = "hyperscale-vm-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The contract SDK: blueprint declarations traced into package metadata"

[features]
default = ["macros"]
# The `#[blueprint]` front end. Separable because the tracer underneath is
# usable on its own, and a build that only consumes metadata should not
# compile a proc macro to get it.
macros = ["dep:hyperscale-vm-sdk-macros"]
# This crate is a package's own, and so may be compiled as the component
# it publishes. What that costs is the executing half and the kernel
# imports under it, which only a wasm32 build of such a crate has any use
# for — a host build of one still reads the declaration, and every other
# consumer only ever reads it. So the feature says *who is compiling*,
# and the target says *as what*: the guest half needs both.
guest = ["dep:wit-bindgen"]

[dependencies]
hyperscale-hbor.workspace = true
# The trait an engine implements, and the types a generated `client`
# wrapper names. Carried on every target: the declaration and the call
# surface are what a package is read through, and a consumer reading one
# may itself be compiled to wasm. The component build drops both as dead
# code, so the artifact is the same bytes either way.
hyperscale-vm-embed.workspace = true
hyperscale-vm-effects.workspace = true
hyperscale-vm-manifest-builder.workspace = true
hyperscale-vm-sdk-macros = { workspace = true, optional = true }
hyperscale-vm-types.workspace = true

# The kernel bindings a contract body executes against, on the target
# that has a kernel to call: the imports, and the generator for them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true, optional = true }

[dev-dependencies]
# The tests build declarations by hand, which is the testing surface.
hyperscale-vm-effects = { workspace = true, features = ["testing"] }
hyperscale-vm-fixtures.workspace = true
# A session to dispatch against: what the generated native half is called
# with, and the one thing the SDK itself deliberately cannot name.
hyperscale-vm-kernel.workspace = true
hyperscale-vm-stdlib.workspace = true
trybuild.workspace = true

[lints]
workspace = true
