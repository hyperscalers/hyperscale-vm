[package]
name = "hyperscale-vm-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The package author's test harness: a chain a contract runs on"

[dependencies]
hyperscale-vm-effects = { workspace = true, features = ["testing"] }
hyperscale-vm-types.workspace = true
hyperscale-vm-kernel.workspace = true
hyperscale-vm-manifest-builder.workspace = true
# The client vocabulary a generated handle is written against: a chain
# creating an instance answers with one.
hyperscale-vm-sdk.workspace = true
# The `#[test]` attribute, which is this crate's surface rather than the
# SDK's: what it expands to is a chain per lane, and a package author
# reaches it through the crate the chain lives in.
hyperscale-vm-sdk-macros.workspace = true
# The account: value has to come from somewhere, and every principal is
# answered by one. A test that seeds a balance is seeding an account's
# vault, so the package is part of the world rather than part of a test.
hyperscale-vm-stdlib.workspace = true
thiserror.workspace = true

# The blessed engine, and the guest build that feeds it. The heavy half
# — wasmtime, and a wasm build of the crate under test — and carried
# unconditionally because the lane it buys answers a question the fast
# one cannot: whether the artifact is admissible, rather than whether
# the contract is right. A chain that could only answer the second would
# make running both a thing each consumer had to remember.
hyperscale-vm-cli.workspace = true
hyperscale-vm-runtime = { workspace = true, features = ["engine"] }
wasmtime.workspace = true

[dev-dependencies]
hyperscale-vm-fixtures.workspace = true

[lints]
workspace = true
