[package]
name = "hyperscale-vm-testing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The package author's test harness: a chain a contract runs on"

[dependencies]
hyperscale-vm-effects.workspace = true
hyperscale-vm-kernel.workspace = true
hyperscale-vm-manifest-builder.workspace = true
# The account: value has to come from somewhere, and every principal is
# answered by one. A test that seeds a balance is seeding an account's
# vault, so the package is part of the world rather than part of a test.
hyperscale-vm-stdlib.workspace = true

# The blessed engine, and the guest build that feeds it. Behind a
# feature because it is the heavy half — wasmtime, and a wasm build of
# the crate under test — and the lane it buys answers a different
# question: whether the artifact is admissible, rather than whether the
# contract is right.
hyperscale-vm-cli = { workspace = true, optional = true }
hyperscale-vm-runtime = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[features]
# Native by default: what an author runs while writing a contract.
default = []
wasm = ["dep:hyperscale-vm-cli", "dep:hyperscale-vm-runtime", "dep:wasmtime"]

[dev-dependencies]
hyperscale-vm-fixtures.workspace = true
# The vocabulary under test: a contract body is written in it.
hyperscale-vm-sdk.workspace = true

[lints]
workspace = true
