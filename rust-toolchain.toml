# The protocol crates build on stable: nothing here needs an unstable
# feature, and a consensus-relevant codebase should not ride a channel
# that moves weekly. Pinned exactly — upgrades are deliberate events,
# never drift.
#
# The lint gates ride nightly instead: `cargo +nightly fmt` for the import
# grouping `rustfmt.toml` asks for, and `cargo +nightly clippy` so a lint
# is heard before it reaches this channel. Neither verdict is a consensus
# artifact. The guest artifacts do want a pin, and carry their own in
# `guests/rust-toolchain.toml` because the deploy-time stack bound needs
# a prelude without panic formatting.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
